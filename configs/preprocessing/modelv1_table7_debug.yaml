# TableFrame7 Stage 1–3 的小规模隔离调试配置。
# 该文件只用于逐步 Debug；正式全量生成应使用 modelv1_table7_final.yaml。

# 配置结构版本，用于人工审计和后续工具识别配置契约。
# 当前加载器不依据它分支；它不是模型版本，也不会写入 table_frame7_n 的数值。
schema_version: modelv1_table7_preprocessing_v1

# 本次要处理的数据集。
dataset:
  # 数据集数字后缀。可写 "11"，也可写完整名称
  # "dataset_dual_rigid_body_11"；加载后都会规范化为 ID "11"。
  id: "11"

# 输入数据根目录和本流水线的输出根目录。
paths:
  # 包含 dataset_dual_rigid_body_<ID>/ 的采集数据根目录。
  # Stage 1 会在其下读取 data_log_*.csv、InsightFace CSV 和原图路径。
  source_root: D:/GithubCode/CrossGaze-main/CrossGaze-main/data_collection

  # Stage 1–3 的统一输出根目录；{dataset_id} 会自动替换为上面的数字 ID。
  # 调试产物放在 data/debug_table7，避免覆盖 data/preprocessed_table7 中的正式结果。
  output_root: data/debug_table7/dataset{dataset_id}

# 真实相机标定参数。
camera:
  # OpenCV 相机标定 YAML，包含原图尺寸、3×3 内参 K 和畸变系数。
  # Stage 2B 用它把虹膜像素反投影成射线，Stage 3 用它反畸变并生成虚拟相机图像。
  calibration_file: configs/camera/crossgaze_camera.yaml

# Stage 1：采集日志、InsightFace 检测和桌面/相机几何整合参数。
base_dataset:
  # 数据集目录内已有的人脸裁剪子目录名。
  # Stage 1 将路径写入 face_path；仅在 face_preprocess=legacy 时由 Stage 2B 读取。
  face_image_dir: insightface_face

  # 数据集目录内的 InsightFace 检测 CSV 文件名；提供 face/left-eye/right-eye 的 xywh 框。
  insightface_coordinates_file: insightface_coordinates.csv

  # hand-eye 外参中平移量的缩放系数。硬编码外参平移以米保存，乘 1000 后统一为毫米。
  handeye_translation_scale: 1000.0

  # 桌面高度 z 的来源。
  # per-sample-target：每帧使用 gaze_target_tz；per-dataset-mean：使用全数据集 tz 均值。
  table_z_source: per-sample-target

# Stage 2A：MediaPipe FaceMesh、Eye15 和眼部几何质量阈值。
mediapipe:
  # FaceMesh 的最小人脸检测置信度，范围 [0,1]；越高通常越严格。
  min_detection_confidence: 0.5

  # 每只眼外眼角到内眼角允许的最小像素距离；小于该值视为眼部几何不可靠。
  min_canthus_distance_px: 8.0

  # 15 个眼部点落在对应 InsightFace eye bbox 内的最小比例，范围 [0,1]。
  min_crop_inside_ratio: 0.8

  # 单眼综合几何质量分数下限，范围 [0,1]；两眼都通过后样本 valid_mask 才为 true。
  min_eye_quality_score: 0.25

# Stage 2B：DECA/FLAME、rotation-only PnP 和 Iris65 metric head pose 参数。
metric_head_pose:
  # 假定的左右虹膜代理点距离，单位 mm；它是绝对 metric 深度的尺度来源。
  # 若被试有实测 IPD，正式生成时应替换为实测值。
  ipd_mm: 65.0

  # Iris65 解出的双眼 baseline 与目标 IPD 向量之间允许的最大残差，单位 mm。
  # 超过该值的样本在 Stage 2B 中记录为 failed，不进入最终训练 CSV。
  max_ipd_residual_mm: 4.0

  # 双虹膜射线最小二乘系统允许的最大条件数；越大表示射线越接近平行、深度越不稳定。
  max_ray_condition: 250.0

  # DECA 输入裁剪方式。
  # deca：从原图 face bbox 按官方方式裁剪；legacy：直接读取已有 face_path 裁剪图。
  face_preprocess: deca

  # 官方风格 DECA 正方形裁剪相对平均 bbox 尺寸的放大倍数，仅 deca 模式使用。
  deca_crop_scale: 1.25

  # 用若干标定帧的 DECA shape 参数中位数建立该被试的固定 FLAME shape。
  # 该选择使用完整 Stage 1 CSV，不受 execution.limit 限制。
  fixed_shape_calibration:
    # 标定区间起点；与 stop 一起构成闭区间。0–4 是为了缩短 Debug 时间。
    # 正式生成不能直接沿用这个短区间，应使用正式配置中人工确认过的稳定帧范围。
    start: 0

    # 标定区间终点，包含该索引本身。
    stop: 4

    # 区间索引方式。frame_idx 按 CSV 的 frame_idx 值选择；position 按候选行位置切片。
    index_mode: frame_idx

# Stage 3：虚拟人脸图像及 TableFrame7 生成参数。
virtual_camera:
  # 虚拟人脸图输出宽度，单位像素。
  face_width: 160

  # 虚拟人脸图输出高度，单位像素。
  face_height: 160

  # 虚拟相机 K_N 的水平和垂直焦距，单位像素；主点自动设在输出图中心。
  focal_length_px: 480.0

  # 虚拟相机归一化后的标准人脸距离，单位 mm；用于计算 distance_scale 和单应矩阵。
  distance_mm: 600.0

# 流水线调度、写入和调试采样参数。
execution:
  # 要执行的逻辑阶段及顺序。
  # 1=基础整合，2=依次执行 2A MediaPipe 与 2B metric pose，3=虚拟相机和 TableFrame7。
  stages: [1, 2, 3]

  # 是否允许覆盖该调试输出目录中已有的 CSV、JSON、NPZ 和 PNG。
  # 这里为 true，便于重复单步调试；正式产物使用前应明确确认覆盖意图。
  overwrite: true

  # 是否只检查/打印将执行的工作而不写产物。
  # 从总入口运行时，true 会只打印各阶段命令；false 才真正执行。
  dry_run: false

  # 昂贵样本循环的最大样本数；3 表示 Stage 2A、2B、3 只处理 Stage 1 的前 3 行。
  # Stage 1 始终完整生成基础 CSV，固定 shape 标定也仍按上面的独立区间选帧。
  # 正式全量生成应设为 null。
  limit: 3

  # 每处理多少个样本打印一次进度；调试设为 1，正式运行可调大以减少终端输出。
  log_every: 1
