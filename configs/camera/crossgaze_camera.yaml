schema_version: pinhole_camera_calibration_v1
name: crossgaze_real_camera

# Real source image size used by this calibration.
image_width_px: 1920
image_height_px: 1080

# OpenCV pinhole camera matrix K, in pixels.
camera_matrix:
  - [1367.8584, 0.0, 957.9159]
  - [0.0, 1369.0087, 543.3381]
  - [0.0, 0.0, 1.0]

# OpenCV distortion coefficients: k1, k2, p1, p2, k3.
distortion_coefficients:
  - 1.78483784e-01
  - -5.90774600e-01
  - -5.11403240e-04
  - -1.08456025e-03
  - 5.95053471e-01
