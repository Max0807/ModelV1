experiment:
  run_name: null
  description: "Stage 2 depth correction: load and freeze the dataset3 gaze model, then train only a bounded shared PnP eye scale; validate on dataset4."
  diary_enabled: true
  diary_path: experiments/experiment_diary.md
  output_dir: outputs
  seed: 42
  deterministic: true

data:
  csv_path: data/processed/modelv1_dataset.csv
  deca_cache_path: data/processed/deca_features_deca_crop_v1.npz
  depth_prior_csv_path: data/processed/depth_priors_deca_crop_v2.csv
  deca_face_preprocess: deca
  deca_crop_scale: 1.25
  split_mode: explicit_datasets
  train_datasets: ["3"]
  val_datasets: ["4"]
  all_datasets: ["3", "4", "5"]
  val_ratio: 0.2
  split_seed: 42
  batch_size: 32
  num_workers: 0
  pin_memory: true
  normalize_images: true
  load_face_image: true
  # The gaze network is frozen; appearance augmentation would only inject
  # changing gaze noise that the 10D PnP-only head cannot explain.
  eye_augmentation:
    enabled: false

model:
  prediction_mode: gaze_geometry
  deca_feature_representation: geometry156
  deca_feature_dim: 156
  deca_branch_mode: flat
  face_embedding_dim: 128
  face_hidden_dims: [256]
  use_face_image: true
  freeze_face_image_backbone: false
  visual_embedding_dim: 128
  visual_attention_dim: 128
  visual_attention_heads: 8
  visual_attention_ffn_dim: 256
  visual_attention_dropout: 0.1
  eye_embedding_dim: 128
  per_eye_embedding_dim: 96
  eye_backbone: resnet18
  eye_backbone_weights: DEFAULT
  share_eye_encoder: true
  use_crop_cam: false
  scene_representation: table_frame7
  scene_dim: 7
  eye_geometry_dim: 6
  eye_geometry_representation: raw_eye6d
  use_eye_geometry: false
  eye_geometry_gate_mode: none
  eye_geometry_quality_dim: 4
  gaze_dim: 3
  fusion_hidden_dims: [256, 128]
  branch_dropout: 0.1
  fusion_dropout: 0.2
  detach_deca_features: true

  # K=1 in this experiment: first isolate whether a single shared PnP scale
  # correction helps before combining it with the K=17 distribution.
  depth_distribution_mode: point
  depth_num_bins: 1
  depth_range_sigma: 3.0
  depth_log_sigma_min: 0.005
  depth_log_sigma_max: 0.20
  depth_reweighter_hidden_dims: [64, 32]
  depth_reweighter_dropout: 0.1
  depth_reweighter_detach_context: true

  use_depth_correction: true
  # Input is fixed at normalized PnP geometry 6D + PnP quality 4D.
  depth_correction_hidden_dims: [64, 32]
  depth_correction_dropout: 0.1

  table_distance_scale_mm: 1000.0
  geometry_min_abs_normal_dot_gaze: 0.02
  geometry_min_lambda_mm: 1.0
  geometry_max_lambda_mm: 5000.0

loss:
  uv_huber_beta_mm: 30.0
  uv_huber_weight: 1.0
  mixture_nll_weight: 0.0
  mixture_kernel_sigma_mm: 30.0
  # Gaze is frozen. The pseudo-gaze target itself depends on raw PnP depth, so
  # it must not pull the correction back toward the uncorrected depth.
  gaze_direction_weight: 0.0
  gaze_angular_weight: 0.0
  depth_prior_kl_weight: 0.0
  ray_validity_weight: 0.1
  ray_penalty_scale_mm: 100.0
  # Disabled until its coefficient is explicitly selected; the sigma-derived
  # tanh bound already prevents an unconstrained correction in this experiment.
  depth_correction_prior_weight: 0.0

training:
  epochs: 100
  device: auto
  amp: true
  grad_clip_norm: 1.0
  trainable_components: depth_correction
  # Required: set this to the trained dataset3->dataset4 point-gaze best.pt.
  # The trainer intentionally refuses to start this frozen-gaze stage when null.
  initialization_checkpoint: outputs\ModelV1_dataset3_train_dataset4_val_V4\20260803_213438\checkpoints\best.pt
  eye_backbone_schedule:
    enabled: false
  optimizer:
    name: adamw
    # Matches the existing frozen-head training stage; tune only after this
    # controlled K=1 experiment establishes whether correction is useful.
    lr: 0.0001
    weight_decay: 0.0001
  scheduler:
    name: cosine
    eta_min: 0.000001
  checkpoint:
    save_last: true
    monitor: val/epe_mm

logging:
  terminal_every_epochs: 10
  wandb:
    enabled: true
    project: ModelV1_dataset3_train_dataset4_val_V4_depth_correction
    entity: null
    mode: online
    tags: [ModelV1, V4, train_dataset_3, val_dataset_4, depth_correction, shared_scale, PnP_10D, K1, frozen_gaze]
