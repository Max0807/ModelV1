experiment:
  run_name: dataset3_4_v4_point_pnp1010_common842
  description: "V4 stage 1: image predicts camera-space gaze; one PnP eye midpoint and parameter-free ray/table geometry predict UV."
  diary_enabled: true
  diary_path: experiments/experiment_diary.md
  output_dir: outputs
  seed: 42
  deterministic: true

data:
  csv_path: data/processed/modelv1_dataset_depth_prior_common.csv  # 与 IPD 实验完全相同的清洗后 842 样本
  deca_cache_path: data/processed/deca_features_deca_crop_v1.npz
  depth_prior_csv_path: data/processed/depth_priors_deca_crop_v1.csv  # 1010 旧的
  # depth_prior_csv_path: data/processed/depth_priors_iris_ipd_65mm_v1.csv  # 65 新的
  deca_face_preprocess: deca
  deca_crop_scale: 1.25
  # split_mode: dataset_5
  split_mode: explicit_datasets
  train_datasets: ["3"]
  val_datasets: ["4"]
  all_datasets: ["3", "4", "5"]
  val_ratio: 0.2
  split_seed: 42
  batch_size: 32
  num_workers: 0
  pin_memory: true
  normalize_images: true
  load_face_image: true
  eye_augmentation:
    enabled: true
    photometric_probability: 0.8
    brightness_min: 0.85
    brightness_max: 1.15
    contrast_min: 0.85
    contrast_max: 1.15
    gamma_min: 0.90
    gamma_max: 1.10
    blur_probability: 0.15
    blur_kernel_size: 3
    blur_sigma_min: 0.1
    blur_sigma_max: 0.8
    noise_probability: 0.25
    noise_std_max: 0.02
    occlusion_probability: 0.15
    occlusion_area_min: 0.01
    occlusion_area_max: 0.05
    occlusion_aspect_min: 0.5
    occlusion_aspect_max: 2.0

model:
  prediction_mode: gaze_geometry
  deca_feature_representation: geometry156
  deca_feature_dim: 156
  deca_branch_mode: flat
  face_embedding_dim: 128
  face_hidden_dims: [256]
  use_face_image: true
  freeze_face_image_backbone: false
  visual_embedding_dim: 128
  visual_attention_dim: 128
  visual_attention_heads: 8
  visual_attention_ffn_dim: 256
  visual_attention_dropout: 0.1
  eye_embedding_dim: 128
  per_eye_embedding_dim: 96
  eye_backbone: resnet18
  eye_backbone_weights: DEFAULT
  share_eye_encoder: true
  use_crop_cam: false
  scene_representation: table_frame7
  scene_dim: 7
  eye_geometry_dim: 6
  eye_geometry_representation: raw_eye6d
  use_eye_geometry: false
  eye_geometry_gate_mode: none
  eye_geometry_quality_dim: 4
  gaze_dim: 3
  fusion_hidden_dims: [256, 128]
  branch_dropout: 0.1
  fusion_dropout: 0.2
  detach_deca_features: true
  depth_distribution_mode: point
  depth_num_bins: 1
  depth_range_sigma: 3.0
  depth_log_sigma_min: 0.005
  depth_log_sigma_max: 0.20
  depth_reweighter_hidden_dims: [64, 32]
  depth_reweighter_dropout: 0.1
  depth_reweighter_detach_context: true
  table_distance_scale_mm: 1000.0
  geometry_min_abs_normal_dot_gaze: 0.02
  geometry_min_lambda_mm: 1.0
  geometry_max_lambda_mm: 5000.0

loss:
  uv_huber_beta_mm: 30.0
  uv_huber_weight: 1.0
  mixture_nll_weight: 0.0
  mixture_kernel_sigma_mm: 30.0
  gaze_direction_weight: 1.0
  gaze_angular_weight: 0.0
  depth_prior_kl_weight: 0.0
  ray_validity_weight: 0.1
  ray_penalty_scale_mm: 100.0

training:
  epochs: 100
  device: auto
  amp: true
  grad_clip_norm: 1.0
  trainable_components: gaze_model
  initialization_checkpoint: null
  eye_backbone_schedule:
    enabled: true
    frozen_epochs: 10
    unfreeze_from: layer4
    lr_multiplier: 0.1
  optimizer:
    name: adamw
    lr: 0.0003
    weight_decay: 0.0001
  scheduler:
    name: cosine
    eta_min: 0.000001
  checkpoint:
    save_last: true
    monitor: val/epe_mm

logging:
  terminal_every_epochs: 10
  wandb:
    enabled: true
    project: ModelV1_dataset3_4_V4
    entity: null
    mode: online
    tags: [ModelV1, V4, dataset_3_4, gaze_geometry, point_pnp, imagenet_resnet18, eye_augmentation]
