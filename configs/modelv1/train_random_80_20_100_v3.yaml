experiment:
  run_name: null
  description: "V3：在V2.2基础上增加RGB人脸ResNet18编码器；face与双眼特征先融合为128D视觉特征，再与DECA、TableFrame和质量门控双眼几何拼接。"
  diary_enabled: true
  diary_path: experiments/experiment_diary.md
  output_dir: outputs
  seed: 42
  deterministic: true

data:
  csv_path: data/processed/modelv1_dataset.csv
  deca_cache_path: data/processed/deca_features_deca_crop_v1.npz
  depth_prior_csv_path: data/processed/depth_priors_deca_crop_v1.csv
  # Official-style DECA square bbox crop is the project default.
  deca_face_preprocess: deca
  deca_crop_scale: 1.25
  split_mode: dataset_5  # random_80_20
  all_datasets: ["3", "4", "5"]
  val_ratio: 0.2
  split_seed: 42
  batch_size: 32
  num_workers: 0
  pin_memory: true
  normalize_images: true
  # V3必须读取CSV中的224x224 face_path图像。
  load_face_image: true

model:
  # 离线DECA参数分支，继承V2.2。
  deca_feature_representation: geometry156
  deca_feature_dim: 156
  deca_branch_mode: flat
  deca_factor_embedding_dim: 64
  deca_factor_hidden_dims: [64]
  face_embedding_dim: 128
  face_hidden_dims: [256]

  # V3新增的RGB face image分支。
  use_face_image: False
  face_image_embedding_dim: 128
  face_image_backbone: resnet18
  face_image_backbone_weights: DEFAULT
  # 冻结stem到layer3，只微调layer4和128D投影头。
  face_image_freeze_until: layer3

  # 双眼图像分支，保持V2.2设置。
  eye_embedding_dim: 128
  per_eye_embedding_dim: 96
  eye_backbone: resnet18
  eye_backbone_weights: null
  share_eye_encoder: true

  # concat(f_face_image, f_eye) -> MLP -> f_visual。
  visual_embedding_dim: 128
  visual_fusion_hidden_dims: [256]

  crop_cam_dim: 36
  use_crop_cam: false
  crop_cam_embedding_dim: 64
  crop_cam_hidden_dims: [128]

  # Scene模式：full25=原始25D；table_frame7=方向6D+距离1D；orientation6d=仅方向6D。
  scene_representation: table_frame7
  scene_dim: 7
  scene_embedding_dim: 64
  scene_hidden_dims: [128]

  # V2.2双眼几何与质量门控。
  eye_geometry_dim: 6
  eye_geometry_representation: raw_eye6d
  use_eye_geometry: true
  eye_geometry_gate_mode: learned_residual
  eye_geometry_quality_dim: 4
  eye_geometry_gate_hidden_dim: 16
  eye_geometry_gate_min: 0.05
  eye_geometry_gate_max: 0.95
  eye_geometry_gate_delta_max: 2.0

  uv_dim: 2
  fusion_hidden_dims: [256, 128]
  branch_dropout: 0.1
  fusion_dropout: 0.2
  detach_deca_features: true

loss:
  beta_mm: 30.0
  gate_regularization_weight: 0.001

training:
  epochs: 300
  device: auto
  amp: true
  grad_clip_norm: 1.0
  optimizer:
    name: adamw
    lr: 0.0003
    weight_decay: 0.0001
  scheduler:
    name: cosine
    eta_min: 0.000001
  checkpoint:
    save_last: true
    monitor: val/epe_mm

logging:
  terminal_every_epochs: 10
  wandb:
    enabled: true
    project: ModelV1_random_80_20_V3
    entity: null
    mode: online
    tags: [ModelV1, V3, deca_geometry156, deca_factorized_geometry, face_image_resnet18, face_eye_visual_fusion, scene_table_frame7, no_crop_cam, eye_geometry_raw_eye6d, quality_gate, random_80_20]
