experiment:
  auto_experiment_identity: false
  run_name: null
  diary_enabled: true
  diary_path: experiments/experiment_diary.md
  output_dir: outputs
  seed: 42
  deterministic: true

data:
  # The loader reads the authoritative Iris65 training-input manifests, then
  # merges their Dataset CSVs, metric-depth priors, and virtual-camera manifests.
  preprocessed_v2_root: data/preprocessed_v2
  dataset_ids: ["11", "3"]
  image_source: virtual_camera
  skip_invalid_virtual_camera_samples: true
  skip_invalid_depth_prior_samples: true
  split_mode: explicit_datasets
  train_datasets: ["11"]
  val_datasets: ["3"]
  batch_size: 32
  num_workers: 0
  pin_memory: true
  normalize_images: true
  # Fixed label-preserving appearance policy; numeric values live in code.
  eye_augmentation: appearance_mild_v1

model:
  prediction_mode: gaze_geometry
  gaze_prediction_frame: virtual_camera
  use_depth_correction: false
  use_face_image: true
  freeze_face_image_backbone: false
  visual_embedding_dim: 128
  visual_attention_dim: 128
  visual_attention_heads: 8
  visual_attention_ffn_dim: 256
  visual_attention_dropout: 0.1
  eye_embedding_dim: 128
  per_eye_embedding_dim: 96
  eye_backbone: resnet18
  eye_backbone_weights: DEFAULT
  share_eye_encoder: true
  use_crop_cam: false
  scene_representation: table_frame7
  scene_dim: 7
  eye_geometry_dim: 6
  eye_geometry_representation: raw_eye6d
  use_eye_geometry: false
  eye_geometry_gate_mode: none
  eye_geometry_quality_dim: 4
  gaze_dim: 3
  use_gaze_uncertainty: true
  gaze_uncertainty_min_std_rad: 0.005
  gaze_uncertainty_max_std_rad: 0.25
  gaze_uncertainty_init_std_rad: 0.02
  fusion_hidden_dims: [256, 128]
  branch_dropout: 0.1
  fusion_dropout: 0.2
  depth_distribution_mode: point
  depth_num_bins: 1
  depth_range_sigma: 3.0
  depth_log_sigma_min: 0.005
  depth_log_sigma_max: 0.20
  depth_reweighter_hidden_dims: [64, 32]
  depth_reweighter_dropout: 0.1
  depth_reweighter_detach_context: true
  table_distance_scale_mm: 1000.0
  geometry_min_abs_normal_dot_gaze: 0.02
  geometry_min_lambda_mm: 1.0
  geometry_max_lambda_mm: 5000.0

loss:
  uv_huber_beta_mm: 30.0
  uv_huber_weight: 1.0
  uv_gaussian_nll_weight: 1.0
  uv_covariance_floor_mm2: 400.0
  gaze_angular_weight: 100.0
  ray_validity_weight: 0.1
  ray_penalty_scale_mm: 100.0

training:
  epochs: 100
  device: auto
  # Ray/table projection can create large direction gradients near parallel
  # rays. FP16 overflows before GradScaler can clip them, so this geometry
  # baseline intentionally trains in FP32.
  amp: false
  grad_clip_norm: 1.0
  trainable_components: gaze_model
  initialization_checkpoint: null
  eye_backbone_schedule:
    enabled: true
    frozen_epochs: 10
    unfreeze_from: layer4
    lr_multiplier: 0.1
  optimizer:
    name: adamw
    lr: 0.0003
    weight_decay: 0.0001
  scheduler:
    name: cosine
    eta_min: 0.000001
  checkpoint:
    save_last: true
    monitor: val/epe_mm

logging:
  terminal_every_epochs: 10
  wandb:
    enabled: true
    project: ModelV1_virtual_camera_cross_camera
    entity: null
    mode: online
    tags:
      - ModelV1
      - V4
      - preprocessed_v2
      - virtual_camera
      - gaze_N_to_C
      - train_dataset_11
      - val_dataset_3
      - selectable_metric_depth
