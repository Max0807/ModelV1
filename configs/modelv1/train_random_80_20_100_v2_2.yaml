experiment:
  run_name: null
  description: "DECA分解编码消融：shape、exp、pose分别经小型MLP后拼接融合为128D；保留RawEye 6D、TableFrame7D、无crop_cam与V2.2质量门控。"
  diary_enabled: true
  diary_path: experiments/experiment_diary.md
  output_dir: outputs
  seed: 42
  deterministic: true

data:
  csv_path: data/processed/modelv1_dataset.csv
  deca_cache_path: data/processed/deca_features_deca_crop_v1.npz
  depth_prior_csv_path: data/processed/depth_priors_deca_crop_v1.csv
  # Official-style DECA square bbox crop is the project default.
  deca_face_preprocess: deca
  deca_crop_scale: 1.25
  split_mode: random_80_20
  all_datasets: ["3", "4", "5"]
  val_ratio: 0.2
  split_seed: 42
  batch_size: 32
  num_workers: 0
  pin_memory: true
  normalize_images: true
  load_face_image: false

model:
  # DECA factorized branch requires this selected geometry-only cache representation.
  deca_feature_representation: geometry156
  deca_feature_dim: 156
  # flat = one MLP over the selected DECA vector; factorized_geometry = shape/exp/pose MLPs then fusion.
  deca_branch_mode: flat
  deca_factor_embedding_dim: 64
  deca_factor_hidden_dims: [64]
  # DECA模式：full236=shape+tex+exp+pose+cam+light；geometry156=shape+exp+pose。
  # 对应维度：full236填236，geometry156填156。
  crop_cam_dim: 36
  use_crop_cam: False
  # Scene模式：full25=原始25D；table_frame7=方向6D+距离1D；orientation6d=仅方向6D。
  scene_representation: table_frame7  # orientation6d
  # 对应维度：full25填25，table_frame7填7，orientation6d填6。
  scene_dim: 7
  eye_geometry_dim: 6
  # normalized6d=[Cx/Cz,Cy/Cz,log(Cz),bx/Cz,by/Cz,bz/Cz]; raw_eye6d=[Lx,Ly,Lz,Rx,Ry,Rz] (mm).
  # Both modes are fitted with a training-set Z-score normalizer before fusion.
  eye_geometry_representation: raw_eye6d
  use_eye_geometry: true
  # none = V2.1; fixed = analytical a0; learned_residual = V2.2.
  eye_geometry_gate_mode: learned_residual
  eye_geometry_quality_dim: 4
  eye_geometry_gate_hidden_dim: 16
  eye_geometry_gate_min: 0.05
  eye_geometry_gate_max: 0.95
  eye_geometry_gate_delta_max: 2.0
  uv_dim: 2
  face_embedding_dim: 128
  face_hidden_dims: [256]
  eye_embedding_dim: 128
  per_eye_embedding_dim: 96
  eye_backbone: resnet18
  eye_backbone_weights: null
  crop_cam_embedding_dim: 64
  crop_cam_hidden_dims: [128]
  scene_embedding_dim: 64
  scene_hidden_dims: [128]
  fusion_hidden_dims: [256, 128]
  branch_dropout: 0.1
  fusion_dropout: 0.2
  share_eye_encoder: true
  detach_deca_features: true

loss:
  beta_mm: 30.0
  gate_regularization_weight: 0.001

training:
  epochs: 300
  device: auto
  amp: true
  grad_clip_norm: 1.0
  optimizer:
    name: adamw
    lr: 0.0003
    weight_decay: 0.0001
  scheduler:
    name: cosine
    eta_min: 0.000001
  checkpoint:
    save_last: true
    monitor: val/epe_mm

logging:
  terminal_every_epochs: 10
  wandb:
    enabled: true
    project: ModelV1_random_80_20_100_deca_crop
    entity: null
    mode: online
    tags: [ModelV1, V2_2, deca_geometry156, deca_factorized_geometry, scene_table_frame7, no_crop_cam, eye_geometry_raw_eye6d, quality_gate, random_80_20]
