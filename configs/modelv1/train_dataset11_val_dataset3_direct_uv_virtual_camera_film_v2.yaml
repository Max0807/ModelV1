defaults: defaults_direct_uv.yaml

experiment:
  auto_experiment_identity: false
  run_name: null
  diary_enabled: true
  diary_path: experiments/experiment_diary.md
  output_dir: outputs
  seed: 42
  deterministic: true

data:
  # Final Iris65 metric-head-origin pipeline. Stage3 already stores the
  # 160x160 virtual face and TableFrame7_N, so no legacy PnP1010 virtual-camera
  # manifest is loaded or applied again.
  table7_stage3_csv_paths:
    - data/preprocessed_table7/dataset13/stage3_virtual_table7/training_table7_dataset13.csv
    - data/preprocessed_table7/dataset11/stage3_virtual_table7/training_table7_dataset11.csv
  dataset_ids: ["13", "11"]
  image_source: legacy  # virtual_camera
  # Stage3 generates only the virtual face. The loader preserves the legacy
  # 90x56 eye crops referenced by each sample's source dataset; these remain
  # aligned with the eye15 pseudo labels.
  # Fifteen MediaPipe points per anatomical eye, expressed in normalized
  # legacy-eye-crop coordinates. Generate these files before training.
  eye_geometry_pseudo_label_paths:
    - data/preprocessed_table7/dataset11/stage2_metric_head_pose/mediapipe_eye15_dataset11.npz
    - data/preprocessed_table7/dataset13/stage2_metric_head_pose/mediapipe_eye15_dataset13.npz
  train_datasets: ["13"]
  val_datasets: ["11"]
  batch_size: 64
  # Two persistent workers hide image decoding/augmentation latency without
  # excessive Windows process and memory overhead.
  num_workers: 2
  persistent_workers: true
  pin_memory: true
  normalize_images: true
  # Fixed label-preserving appearance policy; numeric values live in code.
  eye_augmentation: appearance_mild_v1
  # Face augmentation is photometric only: no flip, crop, rotation, or warp.
  face_augmentation: appearance_mild_v1

model:
  prediction_mode: direct_uv
  # Direct UV does not predict gaze; the camera value preserves the shared
  # configuration contract that reserves virtual_camera for gaze_geometry.
  gaze_prediction_frame: camera
  use_table_frame_film: true
  use_depth_correction: false
  use_face_image: true
  freeze_face_image_backbone: false
  visual_embedding_dim: 128
  visual_attention_dim: 128
  visual_attention_heads: 8
  visual_attention_ffn_dim: 256
  visual_attention_dropout: 0.1
  # Finalized Eye path: small stride-2 stem + FPN aligned to 7x12 tokens.
  use_eye_keypoint_auxiliary: true
  eye_keypoint_count: 15
  eye_keypoint_auxiliary_feature_stage: layer3
  eye_keypoint_auxiliary_hidden_channels: 128
  eye_keypoint_probability_temperature: 1.0
  # The landmark decoder fuses ResNet layer2 + layer3; it never reads the 4x6
  # gaze-token map. Coordinates/covariance remain normalized to the eye crop.
  eye_keypoint_heatmap_size: [14, 23]  # [28, 45]  # [56,90]  #
  eye_keypoint_predict_variance_correction: true
  eye_keypoint_max_abs_log_std_correction: 1.5
  eye_keypoint_shape_embedding_dim: 32
  # Probability-guided appearance tokens are injected into the 48 binocular
  # eye tokens before the existing eye-query/face-key-value attention.
  use_landmark_guided_eye_fusion: true
  landmark_guided_fusion_heads: 4
  landmark_guided_fusion_dropout: 0.1
  # Exact zero keeps the new path identical to the pre-existing eye tokens at
  # initialization; the scalar gate then learns how much geometry to inject.
  landmark_guided_fusion_gate_init: 0.0
  landmark_guided_fusion_gate_max: 1.0
  # Quality biases attention logits and scales landmark values. It combines
  # predicted visibility, normalized heatmap entropy, and posterior covariance.
  landmark_guided_quality_logit_scale: 1.0
  landmark_guided_uncertainty_scale_norm: 0.25
  landmark_guided_min_quality: 0.10
  # Keep UV gradients from changing landmark locations/confidences in the first
  # stable version; UV gradients still train layer2/layer3 appearance sampling.
  landmark_guided_detach_probability_for_sampling: true
  landmark_guided_detach_landmark_statistics: true
  landmark_guided_detach_quality: true
  eye_embedding_dim: 128
  per_eye_embedding_dim: 96
  eye_backbone: resnet18
  eye_backbone_weights: DEFAULT
  share_eye_encoder: true
  use_crop_cam: false
  scene_representation: table_frame7
  scene_dim: 7
  scene_embedding_dim: 64
  scene_hidden_dims: [128]
  eye_geometry_dim: 6
  eye_geometry_representation: raw_eye6d
  use_eye_geometry: false
  eye_geometry_gate_mode: none
  eye_geometry_quality_dim: 4
  use_gaze_uncertainty: false
  fusion_hidden_dims: [256, 128]
  branch_dropout: 0.1
  fusion_dropout: 0.2

loss:
  beta_mm: 30.0
  # Full-covariance NLL in normalized eye-crop coordinates. A 0.01 standard
  # deviation floor prevents a collapsed probability map from becoming singular.
  eye_keypoint_nll_weight: 0.02
  eye_keypoint_min_std_norm: 0.01
  # Pseudo coordinate supervision uses valid * teacher-quality weights.
  eye_landmark_coordinate_weight: 1.0
  # Gaussian heatmap targets use quality-adaptive sigma in output pixels.
  eye_landmark_heatmap_weight: 0.05
  eye_landmark_visibility_weight: 0.1
  eye_landmark_heatmap_sigma_min_px: 1.0
  eye_landmark_heatmap_sigma_max_px: 3.0
  eye_landmark_huber_delta_norm: 0.02
  # Two known crop-space affine views are mapped back before comparison.
  eye_landmark_equivariance_weight: 0.1
  eye_landmark_equivariance_rotation_deg: 4.0
  eye_landmark_equivariance_translation_norm: 0.03
  eye_landmark_equivariance_scale_min: 0.97
  eye_landmark_equivariance_scale_max: 1.03
  # This compares only canonical shape embeddings, never raw left/right XY.
  eye_landmark_mirror_shape_weight: 0.02

training:
  epochs: 80
  device: auto
  # RTX 40-series supports native BF16; BF16 does not require GradScaler.
  amp: true
  amp_dtype: bfloat16
  grad_clip_norm: 1.0
  trainable_components: all
  initialization_checkpoint: null
  eye_backbone_schedule:
    enabled: true
    # Preserve the original full eye-backbone fine-tuning from epoch 1.
    frozen_epochs: 0
    unfreeze_from: stem
    lr_multiplier: 0.05
  optimizer:
    name: adamw
    lr: 0.0003
    weight_decay: 0.0001
    fused: true
  ema:
    enabled: true
    decay: 0.99
    # Keep EMA synchronized during warmup, then start averaging from epoch 4.
    start_after_warmup: true
  scheduler:
    name: cosine
    eta_min: 0.000001
    # With 14 batches/epoch this gives 42 linear warmup optimizer steps.
    warmup_epochs: 3
    warmup_start_factor: 0.1
  checkpoint:
    save_last: true
    monitor: val/epe_mm

logging:
  terminal_every_epochs: 10
  wandb:
    enabled: true
    project: ModelV1_virtual_camera_cross_camera
    entity: null
    mode: online
    tags:
      - ModelV1
      - direct_uv
      - direct_table_UV
      - preprocessed_table7_stage3
      - iris65_metric_head_origin
      - virtual_camera
      - TableFrame7_N
      - table_frame_FiLM
      - Condition17
      - train_dataset_13
      - val_dataset_11
      - selectable_preprocessed_contract
      - H5_small_stem_fpn24
      - face_tokens_3x3
      - eye_tokens_7x12
      - probabilistic_15_point_eye_keypoints
      - full_2d_keypoint_covariance
