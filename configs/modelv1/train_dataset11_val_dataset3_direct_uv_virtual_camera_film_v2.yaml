experiment:
  auto_experiment_identity: false
  run_name: null
  description: "Preprocessed-v2 direct table-UV H5+F0 experiment: train Dataset 13 and validate Dataset 11 with virtual-camera face images and legacy 90x56 eye images; Eye uses H5 small stem + multiscale FPN 4x6 tokens, Face uses the native Inception-ResNet V1 3x3 spatial tokens, then direct table-local (u,v) is predicted with virtual-distance and virtual-pose FiLM."
  diary_enabled: true
  diary_path: experiments/experiment_diary.md
  output_dir: outputs
  seed: 42
  deterministic: true

data:
  # depth_method selects the authoritative preprocessed-v2 sample contract and
  # matching virtual-camera manifest. The direct-UV model does not load the
  # selected metric eye-depth prior for ray/table geometry.
  preprocessed_v2_root: data/preprocessed_v2_160
  # This experiment trains on Dataset 13 and validates on Dataset 11. Keep this
  # list exactly aligned with those two datasets so every selected preprocessed
  # root is present and uses the same 160x160 virtual-camera contract.
  dataset_ids: ["13", "11"]
  depth_method: iris65  # Supported values: iris65, pnp1010.
  image_source: virtual_camera
  # Ablation: keep the face in virtual-camera coordinates while avoiding a
  # second image warp/resampling for the native 90x56 eye crops.
  eye_image_source: legacy
  eye_image_size: [90, 56]
  # Fifteen MediaPipe points per anatomical eye, expressed in normalized
  # legacy-eye-crop coordinates. Generate these files before training.
  eye_geometry_pseudo_label_paths:
    - data/preprocessed_v2_160/mediapipe_eye_geometry_v1_dataset13.npz
    - data/preprocessed_v2_160/mediapipe_eye_geometry_v1_dataset11.npz
  require_eye_geometry_pseudo_labels: true
  # Reserved for H7; ignored while model.use_eye_iris_auxiliary=false.
  iris_supervision_csv_paths:
    - data/preprocessed_v2_160/dataset13/shared/mediapipe_iris_centres_v2_dataset13.csv
    - data/preprocessed_v2_160/dataset11/shared/mediapipe_iris_centres_v2_dataset11.csv
  # The 2D head directly predicts normalized table-local (u, v). No P_N.z
  # reconstruction or output-side camera/table geometry is used.
  direct_uv_target_frame: table_local
  skip_invalid_virtual_camera_samples: true
  skip_invalid_depth_prior_samples: true
  deca_face_preprocess: deca
  deca_crop_scale: 1.25
  split_mode: explicit_datasets
  train_datasets: ["13"]
  val_datasets: ["11"]
  all_datasets: ["13", "11"]
  val_ratio: 0.2
  split_seed: 42
  batch_size: 64
  num_workers: 0
  pin_memory: true
  normalize_images: true
  load_face_image: true
  eye_augmentation:
    enabled: true
    # This policy forbids implicit translation/rotation/crop/flip. Appearance
    # changes preserve coordinates; random erasing only updates visibility.
    coordinate_policy: normalized_eye_crop_appearance_only_v1
    photometric_probability: 0.8
    brightness_min: 0.85
    brightness_max: 1.15
    contrast_min: 0.85
    contrast_max: 1.15
    gamma_min: 0.90
    gamma_max: 1.10
    blur_probability: 0.15
    blur_kernel_size: 3
    blur_sigma_min: 0.1
    blur_sigma_max: 0.8
    noise_probability: 0.25
    noise_std_max: 0.02
    occlusion_probability: 0.15
    occlusion_area_min: 0.01
    occlusion_area_max: 0.05
    occlusion_aspect_min: 0.5
    occlusion_aspect_max: 2.0

model:
  prediction_mode: direct_uv
  # Direct UV does not predict gaze; the camera value preserves the shared
  # configuration contract that reserves virtual_camera for gaze_geometry.
  gaze_prediction_frame: camera
  use_virtual_distance_film: true
  use_virtual_pose_film: true
  virtual_pose_dim: 9
  virtual_distance_film_hidden_dims: [16]
  virtual_distance_film_embedding_dim: 32
  virtual_distance_film_delta_max: 0.1
  use_depth_correction: false
  deca_feature_representation: none
  deca_feature_dim: 0
  deca_branch_mode: flat
  face_embedding_dim: 128
  face_hidden_dims: [256]
  use_face_image: true
  freeze_face_image_backbone: false
  # F0: keep the native Inception-ResNet V1 3x3 face token grid.
  face_feature_mode: native_3x3
  visual_embedding_dim: 128
  visual_attention_dim: 128
  visual_attention_heads: 8
  visual_attention_ffn_dim: 256
  visual_attention_dropout: 0.1
  # H6 remains disabled; the 15-point probabilistic auxiliary head is trained
  # from H5 layer3 without changing the main cross-attention topology.
  use_binocular_self_attention: false
  binocular_attention_heads: 4
  binocular_attention_dropout: 0.1
  # H5 control: mean pooling keeps the cancelled H4 token-pooling off.
  visual_token_pooling: mean
  visual_token_pooling_hidden_dim: 64
  visual_token_pooling_dropout: 0.1
  # Experiment A: 3x3 stride-2 stem, no MaxPool; FPN aligns to layer3 7x12.
  eye_stem_mode: small_3x3_s2_no_maxpool
  eye_feature_mode: multiscale_fpn24
  eye_token_grid: [7, 12]
  # Retain the old one-point iris head only as an ablation. The probabilistic
  # head below supervises all 15 points and exposes full 2D covariance.
  use_eye_iris_auxiliary: false
  eye_iris_auxiliary_feature_stage: layer3
  eye_iris_auxiliary_hidden_channels: 128
  use_eye_keypoint_auxiliary: true
  eye_keypoint_count: 15
  eye_keypoint_auxiliary_feature_stage: layer3
  eye_keypoint_auxiliary_hidden_channels: 128
  eye_keypoint_probability_temperature: 1.0
  # The landmark decoder fuses ResNet layer2 + layer3; it never reads the 4x6
  # gaze-token map. Coordinates/covariance remain normalized to the eye crop.
  eye_keypoint_heatmap_size: [28, 45]  # [56,90]  #
  eye_keypoint_predict_variance_correction: true
  eye_keypoint_max_abs_log_std_correction: 1.5
  eye_keypoint_shape_embedding_dim: 32
  # Probability-guided appearance tokens are injected into the 48 binocular
  # eye tokens before the existing eye-query/face-key-value attention. The
  # legacy vertical residual below remains enabled as a separate ablation path.
  use_landmark_guided_eye_fusion: true
  landmark_guided_fusion_heads: 4
  landmark_guided_fusion_dropout: 0.1
  # Exact zero keeps the new path identical to the pre-existing eye tokens at
  # initialization; the scalar gate then learns how much geometry to inject.
  landmark_guided_fusion_gate_init: 0.0
  landmark_guided_fusion_gate_max: 1.0
  # Quality biases attention logits and scales landmark values. It combines
  # predicted visibility, normalized heatmap entropy, and posterior covariance.
  landmark_guided_quality_logit_scale: 1.0
  landmark_guided_uncertainty_scale_norm: 0.25
  landmark_guided_min_quality: 0.10
  # Keep UV gradients from changing landmark locations/confidences in the first
  # stable version; UV gradients still train layer2/layer3 appearance sampling.
  landmark_guided_detach_probability_for_sampling: true
  landmark_guided_detach_landmark_statistics: true
  landmark_guided_detach_quality: true
  # Keep the 3D template available as an ablation, but do not make it the
  # vertical-correction path in this simplified experiment.
  use_low_dof_eye_template: false
  eye_template_image_size: [90, 56]
  eye_template_pitch_range_deg: [-35.0, 35.0]
  eye_template_yaw_range_deg: [-45.0, 45.0]
  eye_template_pitch_bins: 29
  eye_template_yaw_bins: 31
  eye_template_posterior_temperature: 0.25
  eye_template_covariance_floor_px: 0.75
  eye_template_min_canthus_distance_px: 4.0
  eye_template_min_geometry_confidence: 0.1
  eye_template_center_energy_weight: 1.0
  eye_template_rim_energy_weight: 1.0
  eye_template_angle_prior_weight: 0.05
  eye_template_learnable_parameters: true
  # Estimate the canthus/lid reference frame with landmark covariance, then
  # suppress iris points that lie behind the predicted eyelid aperture.
  eye_template_use_reference_uncertainty: true
  eye_template_use_aperture_visibility: true
  # Simplified vertical path: 15 probabilistic points are reduced to a 22-D
  # iris/aperture/ellipse/uncertainty vector, then fused with global features,
  # scene geometry, and base v to predict only a table-v residual.
  use_pitch_to_v_residual: false
  use_vertical_geometry_residual: true
  vertical_geometry_residual_hidden_dims: [64, 32]
  vertical_geometry_residual_max_abs_delta_mm: 250.0
  # Nonzero only during training, so uncertain initial heatmaps still provide
  # a gradient; evaluation falls back below the confidence threshold.
  vertical_geometry_residual_min_training_gate: 0.10
  vertical_geometry_residual_min_inference_confidence: 0.10
  pitch_to_v_target_frame: table_local
  pitch_to_v_hidden_dims: [32, 16]
  pitch_to_v_max_abs_delta_mm: 250.0
  pitch_to_v_pitch_scale_deg: 20.0
  pitch_to_v_uncertainty_scale_deg: 8.0
  pitch_to_v_disagreement_scale_deg: 6.0
  pitch_to_v_min_pitch_std_deg: 0.5
  pitch_to_v_min_active_gate: 0.05
  pitch_to_v_detach_uncertainty_gate: true
  # Convert eye-local pitch into a per-sample table-v millimetre basis using
  # the virtual-camera/table plane derivative before learned calibration.
  pitch_to_v_use_camera_table_sensitivity: true
  pitch_to_v_min_abs_table_normal_z: 0.1
  eye_embedding_dim: 128
  per_eye_embedding_dim: 96
  eye_backbone: resnet18
  eye_backbone_weights: DEFAULT
  share_eye_encoder: true
  use_crop_cam: false
  scene_representation: table_frame7
  scene_dim: 7
  scene_embedding_dim: 64
  scene_hidden_dims: [128]
  eye_geometry_dim: 6
  eye_geometry_representation: raw_eye6d
  use_eye_geometry: false
  eye_geometry_gate_mode: none
  eye_geometry_quality_dim: 4
  use_gaze_uncertainty: false
  fusion_hidden_dims: [256, 128]
  branch_dropout: 0.1
  fusion_dropout: 0.2
  detach_deca_features: true

loss:
  beta_mm: 30.0
  # The legacy single-iris heatmap loss remains disabled.
  iris_heatmap_weight: 0.0
  iris_heatmap_sigma_pixels: 1.0
  # Full-covariance NLL in normalized eye-crop coordinates. A 0.01 standard
  # deviation floor prevents a collapsed probability map from becoming singular.
  eye_keypoint_nll_weight: 0.02
  eye_keypoint_min_std_norm: 0.01
  # Pseudo coordinate supervision uses valid * teacher-quality weights.
  eye_landmark_coordinate_weight: 1.0
  # Gaussian heatmap targets use quality-adaptive sigma in output pixels.
  eye_landmark_heatmap_weight: 0.05
  eye_landmark_visibility_weight: 0.1
  eye_landmark_heatmap_sigma_min_px: 1.0
  eye_landmark_heatmap_sigma_max_px: 3.0
  eye_landmark_huber_delta_norm: 0.02
  # Two known crop-space affine views are mapped back before comparison.
  eye_landmark_equivariance_weight: 0.1
  eye_landmark_equivariance_rotation_deg: 4.0
  eye_landmark_equivariance_translation_norm: 0.03
  eye_landmark_equivariance_scale_min: 0.97
  eye_landmark_equivariance_scale_max: 1.03
  # This compares only canonical shape embeddings, never raw left/right XY.
  eye_landmark_mirror_shape_weight: 0.02
  # The template is disabled in this simplified experiment.
  eye_template_reprojection_weight: 0.0
  eye_template_binocular_pitch_weight: 0.0
  eye_template_pitch_huber_delta_deg: 2.0
  vertical_residual_regularization_weight: 0.001
  # Supervise v_gt - stopgrad(v_base) through a continuous training gate.
  vertical_residual_supervision_weight: 0.25
  vertical_residual_huber_beta_mm: 30.0

training:
  epochs: 50
  device: auto
  # Keep FP32 aligned with the paired gaze-geometry virtual-camera baseline.
  amp: false
  grad_clip_norm: 1.0
  trainable_components: all
  initialization_checkpoint: null
  eye_backbone_schedule:
    enabled: true
    frozen_epochs: 0
    unfreeze_from: stem
    lr_multiplier: 0.05
  optimizer:
    name: adamw
    lr: 0.0003
    weight_decay: 0.0001
  scheduler:
    name: cosine
    eta_min: 0.000001
  checkpoint:
    save_last: true
    monitor: val/epe_mm

logging:
  terminal_every_epochs: 10
  wandb:
    enabled: true
    project: ModelV1_virtual_camera_cross_camera
    entity: null
    mode: online
    tags:
      - ModelV1
      - direct_uv
      - direct_table_UV
      - preprocessed_v2
      - virtual_camera
      - TableFrame7_N
      - virtual_distance_FiLM
      - virtual_pose_FiLM
      - Condition17
      - train_dataset_13
      - val_dataset_11
      - selectable_preprocessed_contract
      - no_DECA
      - H5_small_stem_fpn24
      - F0_native_3x3
      - face_tokens_3x3
      - no_H6_binocular_self_attention
      - probabilistic_15_point_eye_keypoints
      - full_2d_keypoint_covariance
